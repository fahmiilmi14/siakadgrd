<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ITS Grade Monitor - Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <span class="logo-emoji">🎓</span>
        <div class="logo-text">
          <h1>ITS Grade Monitor</h1>
          <span class="subtitle">Extension Settings & Control Panel</span>
        </div>
      </div>
    </header>

    <div class="content-layout">
      <!-- Main Settings Column -->
      <main class="settings-column">
        
        <!-- Telegram Section -->
        <section class="settings-card">
          <div class="card-header">
            <svg class="card-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            <h2>Telegram Bot Integration</h2>
          </div>
          <div class="card-body">
            <div class="input-group">
              <label for="telegram-token">Bot Token</label>
              <div class="password-wrapper">
                <input type="password" id="telegram-token" placeholder="123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ">
                <button id="btn-toggle-token" type="button" class="btn-icon">
                  <svg class="icon-eye" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></button>
              </div>
            </div>
            <div class="input-group">
              <label for="telegram-chat-id">Chat ID</label>
              <input type="text" id="telegram-chat-id" placeholder="-100123456789 or 12345678">
            </div>
            <button id="btn-test-telegram" class="btn btn-secondary btn-full">
              <svg class="icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
              Test Connection
            </button>
          </div>
        </section>

        <!-- Interval & Monitor Section -->
        <section class="settings-card">
          <div class="card-header">
            <svg class="card-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            <h2>Monitoring Configuration</h2>
          </div>
          <div class="card-body">
            <div class="input-group">
              <label for="monitor-interval">Check Interval</label>
              <select id="monitor-interval">
                <option value="1">1 Minute (Testing only)</option>
                <option value="5">5 Minutes</option>
                <option value="10">10 Minutes</option>
                <option value="15" selected>15 Minutes</option>
                <option value="30">30 Minutes</option>
                <option value="60">1 Hour</option>
              </select>
            </div>
          </div>
        </section>

        <!-- System & Debug Mode Section -->
        <section class="settings-card">
          <div class="card-header">
            <svg class="card-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            <h2>System Preferences</h2>
          </div>
          <div class="card-body">
            <div class="toggle-group-row">
              <div class="toggle-text">
                <span class="toggle-title">Debug Mode</span>
                <span class="toggle-description">Record parser telemetry statistics in storage on checks.</span>
              </div>
              <label class="switch">
                <input type="checkbox" id="debug-mode">
                <span class="slider round"></span>
              </label>
            </div>
          </div>
        </section>

      </main>

      <!-- Side Column: Import/Export & Reset -->
      <aside class="sidebar-column">
        
        <!-- Maintenance Section -->
        <section class="settings-card highlight-card">
          <div class="card-header">
            <svg class="card-icon" viewBox="0 0 24 24"><path d="M19 12h-2v3H7v-3H5v3c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-3zm-1-4l-1.41-1.41L13 10.17V4h-2v6.17L7.41 6.59 6 8l6 6 6-6z"/></svg>
            <h2>Data Backup & Sync</h2>
          </div>
          <div class="card-body gap-12">
            <button id="btn-export" class="btn btn-primary btn-full">
              <svg class="icon" viewBox="0 0 24 24"><path d="M2 12.5C2 9.46 4.46 7 7.5 7H18c2.21 0 4 1.79 4 4 0 2.05-1.53 3.76-3.5 3.97V15c0 .55-.45 1-1 1s-1-.45-1-1v-.93c-.03 0-.07.01-.1.01H7.5c-2.48 0-4.5-2.02-4.5-4.5S5.02 6 7.5 6H8c.55 0 1-.45 1-1s-.45-1-1-1H7.5C3.91 4 1 6.91 1 10.5c0 3.1 2.19 5.7 5.12 6.35.54.12 1.08-.21 1.2-.75.12-.54-.21-1.08-.75-1.2C4.24 14.39 2.75 12.63 2 12.5zm13.1-4.4c.39-.39.39-1.02 0-1.41L12.7 4.3c-.39-.39-1.02-.39-1.41 0L8.9 6.7c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l.7-.7V12c0 .55.45 1 1 1s1-.45 1-1V7.4l.7.7c.38.38 1.01.38 1.39.1z"/></svg>
              Export Settings
            </button>
            
            <div class="import-wrapper">
              <label for="import-file" class="btn btn-secondary btn-full">
                <svg class="icon" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                Import Settings
              </label>
              <input type="file" id="import-file" accept=".json">
            </div>

            <hr class="divider">

            <button id="btn-reset" class="btn btn-danger btn-full">
              <svg class="icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              Reset to Defaults
            </button>
          </div>
        </section>

        <!-- Save Banner -->
        <div id="save-status" class="save-status hidden">
          <span>✓ Settings saved successfully.</span>
        </div>

      </aside>
    </div>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
